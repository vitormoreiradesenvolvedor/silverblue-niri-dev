name: bluebuild
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "00 06 * * 1"   # toda segunda, 06:00 UTC (03:00 BRT)
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

jobs:
  bluebuild:
    name: Build ${{ matrix.recipe }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - recipe.yml
    steps:
      # Chrome + Brave + Docker + DBeaver + Qt6 estouram o disco padrao
      # do runner (~14 GB livres). Libera espaco antes do build.
      - name: Libera espaco em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      /opt/hostedtoolcache "${AGENT_TOOLSDIRECTORY}"
          sudo docker image prune --all --force || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build, assina e publica
        uses: blue-build/github-action@v1.8
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
