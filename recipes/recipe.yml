# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
---
name: silverblue-niri-dev
description: Fedora Silverblue + niri/iNiR + NVIDIA hibrida + toolchains nativos (Docker, Node, C/C++, Mullvad, DBeaver TLS1.0)
base-image: ghcr.io/ublue-os/silverblue-nvidia
image-version: 44

modules:
  # ----------------------------------------------------------------------
  # 1. Arquivos estaticos (repos .repo, systemd units, skel, profile.d)
  #    Vem primeiro: os .repo precisam existir antes do dnf.
  # ----------------------------------------------------------------------
  - type: files
    files:
      - source: system
        destination: /

  # ----------------------------------------------------------------------
  # 2. Preparacao: chaves GPG dos repos de terceiros, resolucao do
  #    $releasever do repo Docker, remocao de pacotes conflitantes.
  # ----------------------------------------------------------------------
  - type: script
    scripts:
      - 10-import-repo-keys.sh
      - 15-prepare-docker.sh

  # ----------------------------------------------------------------------
  # 3. Camada RPM
  # ----------------------------------------------------------------------
  - type: dnf
    repos:
      # O Fedora 44 empacota quickshell 0.2.1, e o iNiR exige >= 0.3: ele
      # importa Quickshell.Networking e usa pragmas da 0.3. Este e o mesmo
      # COPR que o instalador do iNiR habilitaria sozinho.
      copr:
        - errornointernet/quickshell
    install:
      # wf-recorder e companhia puxam libs de ffmpeg que colidem com o
      # ffmpeg-free da base; o instalador do iNiR usa --allowerasing pelo
      # mesmo motivo.
      allow-erasing: true
      packages:
        # --- compositor niri + sessao Wayland ---
        - niri
        - xwayland-satellite
        - mate-polkit
        - pipewire
        - pipewire-pulseaudio
        - pipewire-utils
        - wireplumber
        - network-manager-applet
        - brightnessctl
        - playerctl
        - grim
        - slurp
        - wl-clipboard
        - fuzzel
        - ptyxis
        - xdg-desktop-portal-gtk
        - xdg-desktop-portal-gnome
        # --- Qt6 (runtime do shell iNiR / quickshell) ---
        - qt6-qtbase
        - qt6-qtdeclarative
        - qt6-qtsvg
        - qt6-qtwayland
        - qt6-qt5compat
        - qt6-qtimageformats
        - qt6-qtmultimedia
        # --- toolchain C/C++ ---
        - gcc
        - gcc-c++
        - clang
        - make
        - cmake
        - ninja-build
        - gdb
        - pkgconf-pkg-config
        - glibc-devel
        # --- Node / npx ---
        # Fedora 44 nao tem mais o metapacote 'nodejs': so versionados.
        # nodejs24-npm fornece /usr/bin/npm e /usr/bin/npx.
        - nodejs24
        - nodejs24-npm
        # --- utilitarios ---
        - fastfetch
        - git
        - curl
        - wget2-wget
        - zsh
        - unzip
        - tar
        - jq
        - just
        # --- rede / VPN ---
        - wireguard-tools
        - mullvad-vpn
        # --- containers ---
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin
        # --- snap ---
        - snapd
        - snapd-selinux
        # --- navegadores ---
        - google-chrome-stable
        - brave-browser
        # ----------------------------------------------------------------
        # Dependencias do iNiR
        #
        # Extraidas de sdata/dist-fedora/install-deps.sh do proprio iNiR e
        # conferidas uma a uma contra o Fedora 44. Ficam na imagem porque a
        # fase de dependencias do './setup' roda `sudo dnf`, que nao existe
        # em sistema atomico e nem teria como pedir senha no first-run.
        #
        # Fora da lista de proposito:
        #   sddm       - competiria com o gdm da base; o tema de login do
        #                iNiR e opcional e a fase que trocaria o display
        #                manager e justamente a que pulamos.
        #   hyprpicker - saiu do Fedora 44; o iNiR compilaria na mao.
        # ----------------------------------------------------------------
        - ImageMagick
        - NetworkManager
        - adwaita-icon-theme
        - blueman
        - breeze-gtk
        - cairo-devel
        - cairo-gobject-devel
        - cava
        - cliphist
        - coreutils
        - dbus-devel
        - ddcutil
        - dejavu-fonts-all
        - easyeffects
        - eza
        - ffmpegthumbnailer
        - file
        - fish
        - fontconfig
        - fprintd
        - geoclue2
        - glib2
        - glib2-devel
        - gnome-keyring
        - google-noto-color-emoji-fonts
        - gtk3-devel
        - gum
        - hicolor-icon-theme
        - jemalloc
        - jetbrains-mono-fonts-all
        - kde-gtk-config
        - kdialog
        - kf6-kconfig
        - kf6-kirigami
        - kf6-syntax-highlighting
        - kitty
        - kvantum
        - libdrm
        - liberation-fonts-all
        - libnotify
        - libxcb
        - lsp-plugins-lv2
        - mesa-dri-drivers
        - meson
        - mpv
        - nautilus
        - nm-connection-editor
        - papirus-icon-theme
        - pavucontrol
        - pipewire-alsa
        - plasma-browser-integration
        - plasma-integration
        - polkit
        - python3
        - qalculate
        - qt6-qttools
        - qt6ct
        - quickshell
        - ripgrep
        - rsync
        - socat
        - swappy
        - swayidle
        - swaylock
        - tesseract
        - tesseract-langpack-chi_sim
        - tesseract-langpack-chi_sim_vert
        - tesseract-langpack-chi_tra
        - tesseract-langpack-chi_tra_vert
        - tesseract-langpack-eng
        - tesseract-langpack-jpn
        - tesseract-langpack-jpn_vert
        - tesseract-langpack-rus
        - tesseract-langpack-spa
        - translate-shell
        - tumbler
        - upower
        - wf-recorder
        - wlsunset
        - wtype
        - xdg-desktop-portal
        - xdg-user-dirs
        - ydotool
        - yt-dlp

  # ----------------------------------------------------------------------
  # 4. Instalacoes fora de repo + patches de build
  # ----------------------------------------------------------------------
  - type: script
    scripts:
      - 20-install-dbeaver-tls.sh
      - 30-install-antigravity.sh
      - 40-enable-transient-root.sh
      - 50-install-claude-cli.sh

  # ----------------------------------------------------------------------
  # 5. Servicos
  # ----------------------------------------------------------------------
  - type: systemd
    system:
      enabled:
        - docker.service
        - docker.socket
        - containerd.service
        - snapd.socket
        - snapd.service
        - snap.mount
        - mullvad-daemon.service
        - setup-user-groups.service
        - homebrew-prepare.service
    user:
      enabled:
        - custom-first-run.service
        - custom-inir-update.timer

  # ----------------------------------------------------------------------
  # 6. Flatpaks de sistema
  # ----------------------------------------------------------------------
  # Schema v2: 'configurations' substituiu os blocos system/user, os campos
  # repo-* viraram repo.{url,name,title} e 'remove' deixou de existir.
  # O bloco 'repo' e omitido de proposito: as imagens Universal Blue ja trazem
  # o remote Flathub de sistema configurado, e Flathub e o default do modulo.
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: true
        install:
          - com.slack.Slack
          - com.github.IsmaelMartinez.teams_for_linux

  # ----------------------------------------------------------------------
  # 7. Politica de assinatura cosign dentro da imagem
  # ----------------------------------------------------------------------
  - type: signing
