# /snap precisa existir como diretorio de topo para snaps classic.
# Depende de root.transient = true (ver files/scripts/40-enable-transient-root.sh).
d /snap 0755 root root -

# /var/lib/snapd/snap e o alvo real do bind mount (snap.mount).
d /var/lib/snapd 0755 root root -
d /var/lib/snapd/snap 0755 root root -

# /usr/local -> /var/usrlocal no ostree. Expoe o claude tambem nesse caminho.
d /var/usrlocal 0755 root root -
d /var/usrlocal/bin 0755 root root -
L+ /var/usrlocal/bin/claude - - - - /usr/bin/claude
