# Garante a existencia dos grupos mesmo que nenhum RPM os crie.
# sysusers.d roda antes dos servicos e sobrevive a atualizacoes da imagem.
g docker -
g dialout -
# Exigidos pelo iNiR (2.setups.sh): video/input para o compositor e o
# ydotool, i2c para o ddcutil (brilho de monitor externo), network para o
# NetworkManager. video e input ja existem no Fedora; i2c e network nao.
g i2c -
g network -
